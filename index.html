<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Б'юті-трекер</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%235e0000'/%3E%3Cpath d='M32 14c1 7 3 10 10 12-7 2-9 5-10 12-1-7-3-10-10-12 7-2 9-5 10-12z' fill='%23ffffff'/%3E%3Ccircle cx='48' cy='16' r='3.4' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#5e0000;
    --card:#FFFFFF;
    --purple-light:#f0e4e4;
    --purple:#8a3a3a;
    --purple-deep:#5e0000;
    --green-light:#ecd6d6;
    --green:#8a4a3a;
    --green-deep:#5e0000;
    --text:#5e0000;
    --text-soft:#8a5a5a;
    --border:#d9bcbc;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Manrope',sans-serif;
    color:var(--text);
    min-height:100vh;
    padding-bottom:84px;
  }
  h1,h2,.display{font-family:'Fraunces',serif;}

  header{
    padding:28px 20px 14px;
    text-align:center;
  }
  header .eyebrow{
    font-size:13px;
    color:#ffffff;
    opacity:0.85;
    letter-spacing:0.02em;
    margin-bottom:2px;
  }
  header h1{
    font-size:28px;
    font-weight:600;
    margin:0;
    color:#ffffff;
  }

  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:480px;
    margin:0 auto 6px;
    padding:0 20px;
  }
  .nav-row button{
    background:none;
    border:none;
    font-size:22px;
    color:#ffffff;
    cursor:pointer;
    padding:6px 14px;
    border-radius:12px;
  }
  .nav-row button:active{background:rgba(255,255,255,0.15);}
  .month-label{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:500;
    color:#ffffff;
  }

  .card{
    max-width:480px;
    margin:0 auto;
    background:var(--card);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:18px 14px 20px;
  }

  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:12px;
    color:var(--text-soft);
    margin-bottom:8px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
  }
  .cell{
    aspect-ratio:1/1;
    border-radius:14px;
    background:var(--purple-light);
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    padding:2px;
    transition:transform .12s ease;
  }
  .cell:active{transform:scale(0.94);}
  .cell.empty{visibility:hidden; cursor:default;}
  .cell.today{border:1.5px solid var(--purple);}
  .cell .num{
    font-size:11px;
    color:var(--text-soft);
    position:absolute;
    top:4px;
    left:6px;
  }
  .cell.today .num{color:var(--purple-deep); font-weight:700;}
  .icons{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:1px;
    max-width:90%;
    margin-top:6px;
  }
  .icons img{width:20px; height:20px; object-fit:cover; border-radius:3px; display:block;}
  .icons .more{
    font-size:9px;
    color:var(--text-soft);
    font-weight:700;
  }

  /* bottom nav */
  .tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--card);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 18px rgba(108,79,160,0.06);
  }
   .tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:500;
    color:var(--text-soft);
    cursor:pointer;
    padding:2px 18px;
  }
  .tab.active{color:var(--purple-deep); font-weight:600;}
  .tab .dot{
    width:6px;height:6px;border-radius:50%;
    background:transparent;
  }
  .tab.active .dot{background:var(--purple);}

  /* modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(55,47,77,0.35);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--card);
    width:100%;
    max-width:480px;
    border-radius:26px 26px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:82vh;
    overflow-y:auto;
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .sheet-head h2{font-size:19px; margin:0; font-weight:500;}
  .sheet-head .close{
    font-size:20px; color:var(--text-soft); cursor:pointer;
    background:var(--bg); width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .option-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 12px;
    border-radius:16px;
    margin-bottom:7px;
    border:1.5px solid var(--border);
    cursor:pointer;
    transition:all .12s ease;
  }
  .option-row .icon{
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    background:var(--purple-light);
    flex-shrink:0;
    overflow:hidden;
  }
  .option-row .icon img{width:100%; height:100%; object-fit:cover;}
  .option-row.group-green .icon{background:var(--green-light);}
  .option-row .label{font-size:14.5px; flex:1;}
  .option-row .check{
    width:20px;height:20px;border-radius:7px;
    border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:12px; color:#fff;
    flex-shrink:0;
  }
  .option-row.active{
    border-color:var(--purple);
    background:var(--purple-light);
  }
  .option-row.group-green.active{
    border-color:var(--green);
    background:var(--green-light);
  }
  .option-row.active .check{background:var(--purple-deep); border-color:var(--purple-deep);}
  .option-row.group-green.active .check{background:var(--green-deep); border-color:var(--green-deep);}

  .save-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:16px;
    background:var(--purple-deep);
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-size:15px;
    font-weight:700;
    margin-top:10px;
    cursor:pointer;
  }
  .save-btn:active{opacity:.85;}

  /* stats */
  .stats-wrap{max-width:480px; margin:0 auto; padding:0 20px;}
  .toggle-row{
    display:flex;
    background:var(--purple-light);
    border-radius:14px;
    padding:3px;
    margin-bottom:16px;
  }
  .toggle-row button{
    flex:1;
    border:none;
    background:none;
    padding:9px 0;
    border-radius:11px;
    font-family:'Manrope',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--purple-deep);
    cursor:pointer;
  }
  .toggle-row button.active{background:var(--card); box-shadow:0 2px 8px rgba(108,79,160,0.12);}

  .summary-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  .summary-card{
    flex:1;
    background:var(--card);
    border-radius:18px;
    padding:14px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .summary-card .num{font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--purple-deep);}
  .summary-card.green .num{color:var(--green-deep);}
  .summary-card .lbl{font-size:11px; color:var(--text-soft); margin-top:2px;}

 .last-used-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 4px;
  border-bottom:1px solid var(--border);
}
.last-used-row:last-child{border-bottom:none;}
.last-used-row .name{display:flex; align-items:center; gap:9px; font-size:13.5px; flex-shrink:0;}
.last-used-row .name img{width:22px; height:22px; object-fit:cover; border-radius:6px;}
.last-used-row .last-date{
  font-size:13px;
  color:var(--text);
  text-align:right;
  white-space:nowrap;
}
.last-used-row .ago{color:var(--text-soft); font-size:12px;}

  .empty-state{
    text-align:center;
    color:var(--text-soft);
    font-size:13px;
    padding:30px 10px;
  }

  .status-dot{
    position:fixed; top:14px; right:16px;
    font-size:10px; color:var(--text-soft);
    display:flex; align-items:center; gap:5px;
  }
  .status-dot .d{width:6px;height:6px;border-radius:50%;background:#D8D2E6;}
  .status-dot.online .d{background:var(--green);}
</style>
</head>
<body>

<div class="status-dot" id="statusDot"><span class="d"></span><span id="statusText">офлайн</span></div>

<header>
  <div class="eyebrow"></div>
  <h1>Б'юті-трекер</h1>
</header>

<div id="calendarView">
  <div class="nav-row">
    <button id="prevMonth">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextMonth">›</button>
  </div>
  <div class="card">
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Нд</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="statsView" style="display:none;">
  <div class="stats-wrap">
    <div class="toggle-row">
      <button id="rangeMonth" class="active">Цей місяць</button>
      <button id="rangeAll">Весь час</button>
    </div>
    <div class="summary-row">
      <div class="summary-card">
        <div class="num" id="totalDays">0</div>
        <div class="lbl">днів з доглядом</div>
      </div>
      <div class="summary-card green">
        <div class="num" id="hairStreak">0</div>
        <div class="lbl">днів поспіль без миття голови</div>
      </div>
    </div>
   <div id="barsWrap" class="card" style="max-width:none;"></div>
  </div>
</div>

<div class="tabbar">
  <div class="tab active" id="tabCal"><span class="dot"></span>Календар</div>
  <div class="tab" id="tabStats"><span class="dot"></span>Статистика</div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="sheetDate"></h2>
      <div class="close" id="closeSheet">✕</div>
    </div>
    <div id="optionsList"></div>
    <button class="save-btn" id="saveBtn">Зберегти</button>
  </div>
</div>

<!-- Firebase compat SDK: класичні script-теги, не ES-модулі, щоб прев ʼю/GitHub Pages не залежали від підтримки модулів -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // ====== FIREBASE CONFIG ======
  // Встав сюди конфіг свого Firebase-проєкту (можна той самий, що й для Galaxy Fit3,
  // просто дані ляжуть в окрему колекцію "beautyEntries" — це не заважає одне одному).
 const firebaseConfig = {
  apiKey: "AIzaSyC3QUzJeA59_ghX3c6F-ZVG9vOmutSkNHs",
  authDomain: "mission-galaxy.firebaseapp.com",
  projectId: "mission-galaxy",
  storageBucket: "mission-galaxy.firebasestorage.app",
  messagingSenderId: "13838338323",
  appId: "1:13838338323:web:9c6cd5f52fe9c02b0672e6",
  measurementId: "G-C98808KB8B"
  };

  let db = null;
  let firebaseReady = false;
  try {
    if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "ВСТАВ_СЮДИ") {
      const app = firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      firebaseReady = true;
    }
  } catch(e){
    console.warn("Firebase не налаштовано, працюю локально:", e);
  }

  // ====== DATA MODEL ======
  // Встав сюди прямі посилання на картинки продуктів (наприклад, завантажені на imgur,
  // або сирі лінки на файли з твого GitHub-репозиторію: .../raw/main/images/toner.png)
  const ACTIONS = [
    { id:'serum',     label:'Сироватка Cos de Baha',    icon:'https://i.postimg.cc/j5QX2929/cos.png',     group:'purple' },
    { id:'powder',    label:'Ензимна пудра',            icon:'https://cdn-prod.eva.ua/img/0/0/source/8/8/880056_1_1786696687.jpg',    group:'purple' },
    { id:'keraskin',  label:'Кераскін для тіла',        icon:'https://apteka911.ua/content/shop/products/285733/photos/763518-285733-big-1500x1500-c932.jpg',  group:'green' },
    { id:'uriage',    label:'Uriage для шкіри голови',  icon:'https://www.my-origines.com/dw/image/v2/BJRD_PRD/on/demandware.static/-/Sites-base-master/default/dw675425dc/images/P2800003_S1.jpg?sw=1500&sh=1500&sm=fit',    group:'green' },
    { id:'psotriol',  label:'Псотріол для вуха',        icon:'https://i.podorozhnyk.com/products/63352874-ca5b-4f46-ac94-878cae0a43c7-large.webp',  group:'green' },
    { id:'hairwash',  label:'Миття голови',             icon:'https://cosibella.com.ua/hpeciai/5bad67549fc24344dbe37fba1545672a/rus_pl_Uriage-D-S-Hair-Equilibrant-Shampoo-REGULIRUIUSHCHII-SHAMPUN-DLIA-VOLOS-500ml-14624_1.webp',  group:'green' },
  ];
  const actionMap = Object.fromEntries(ACTIONS.map(a => [a.id, a]));

  let entries = {};          // { "2026-09-01": ["toner","cream"] }
  let localOverride = !firebaseReady;
  const LOCAL_KEY = 'beauty-tracker-entries';

  function loadLocal(){
    try{ entries = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); }catch(e){ entries = {}; }
  }
  function saveLocal(){
    localStorage.setItem(LOCAL_KEY, JSON.stringify(entries));
  }

  function setStatus(online){
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.classList.toggle('online', online);
    text.textContent = online ? 'синхронізовано' : 'офлайн';
  }

  if (firebaseReady){
   db.collection('beautyEntries').onSnapshot((snap) => {
      const next = {};
      snap.forEach(d => { next[d.id] = d.data().actions || []; });
      entries = next;
      setStatus(true);
      render();
    }, (err) => {
      console.warn('Firestore помилка, переходжу на локальне сховище:', err);
      localOverride = true;
      loadLocal();
      setStatus(false);
      render();
    });
  } else {
    loadLocal();
    setStatus(false);
  }

  async function persistDay(dateStr, actions){
    entries[dateStr] = actions;
    if (firebaseReady && !localOverride){
      try{
        await db.collection('beautyEntries').doc(dateStr).set({ actions, updatedAt: new Date().toISOString() });
      }catch(e){
        console.warn('Не вдалось зберегти у Firestore, зберігаю локально:', e);
        saveLocal();
      }
    } else {
      saveLocal();
    }
    render();
  }

  // ====== CALENDAR ======
  const MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  let cur = new Date();
  cur.setDate(1);

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function todayKey(){ const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }

  document.getElementById('prevMonth').onclick = () => { cur.setMonth(cur.getMonth()-1); render(); };
  document.getElementById('nextMonth').onclick = () => { cur.setMonth(cur.getMonth()+1); render(); };

  function renderCalendar(){
    const y = cur.getFullYear(), m = cur.getMonth();
    document.getElementById('monthLabel').textContent = `${MONTHS[m]} ${y}`;
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const firstDay = new Date(y, m, 1);
    let startOffset = firstDay.getDay() - 1; // Monday-first
    if (startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(y, m+1, 0).getDate();

    for (let i=0;i<startOffset;i++){
      const c = document.createElement('div');
      c.className = 'cell empty';
      grid.appendChild(c);
    }

    for (let d=1; d<=daysInMonth; d++){
      const key = dateKey(y,m,d);
      const cell = document.createElement('div');
      cell.className = 'cell' + (key === todayKey() ? ' today' : '');
      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = d;
      cell.appendChild(num);

      const dayActions = entries[key] || [];
      if (dayActions.length){
        const wrap = document.createElement('div');
        wrap.className = 'icons';
        const shown = dayActions.slice(0,4);
        shown.forEach(id => {
          const a = actionMap[id];
          if (!a) return;
          const img = document.createElement('img');
          img.src = a.icon;
          img.alt = a.label;
          wrap.appendChild(img);
        });
        if (dayActions.length > 4){
          const more = document.createElement('span');
          more.className = 'more';
          more.textContent = '+'+(dayActions.length-4);
          wrap.appendChild(more);
        }
        cell.appendChild(wrap);
      }

      cell.onclick = () => openSheet(key);
      grid.appendChild(cell);
    }
    grid.style.setProperty('--rows', Math.ceil((startOffset+daysInMonth)/7));
  }

  // ====== SHEET / MODAL ======
  let activeDate = null;
  let activeSelection = new Set();

  function openSheet(key){
    activeDate = key;
    activeSelection = new Set(entries[key] || []);
    const [y,m,d] = key.split('-').map(Number);
    document.getElementById('sheetDate').textContent = `${d} ${MONTHS[m-1].toLowerCase()}`;
    const list = document.getElementById('optionsList');
    list.innerHTML = '';
    ACTIONS.forEach(a => {
      const row = document.createElement('div');
      row.className = 'option-row' + (a.group === 'green' ? ' group-green' : '') + (activeSelection.has(a.id) ? ' active' : '');
      row.innerHTML = `
        <div class="icon"><img src="${a.icon}" alt="${a.label}"></div>
        <div class="label">${a.label}</div>
        <div class="check">${activeSelection.has(a.id) ? '✓' : ''}</div>
      `;
      row.onclick = () => {
        if (activeSelection.has(a.id)){ activeSelection.delete(a.id); }
        else { activeSelection.add(a.id); }
        row.classList.toggle('active');
        row.querySelector('.check').textContent = activeSelection.has(a.id) ? '✓' : '';
      };
      list.appendChild(row);
    });
    document.getElementById('overlay').classList.add('open');
  }
  document.getElementById('closeSheet').onclick = () => document.getElementById('overlay').classList.remove('open');
  document.getElementById('overlay').onclick = (e) => { if (e.target.id === 'overlay') e.currentTarget.classList.remove('open'); };
  document.getElementById('saveBtn').onclick = () => {
    persistDay(activeDate, Array.from(activeSelection));
    document.getElementById('overlay').classList.remove('open');
  };

  // ====== TABS ======
  document.getElementById('tabCal').onclick = () => switchTab('cal');
  document.getElementById('tabStats').onclick = () => switchTab('stats');
  function switchTab(tab){
    document.getElementById('calendarView').style.display = tab==='cal' ? '' : 'none';
    document.getElementById('statsView').style.display = tab==='stats' ? '' : 'none';
    document.getElementById('tabCal').classList.toggle('active', tab==='cal');
    document.getElementById('tabStats').classList.toggle('active', tab==='stats');
    if (tab==='stats') renderStats();
  }

  // ====== STATS ======
  let statsRange = 'month';
  document.getElementById('rangeMonth').onclick = () => { statsRange='month'; toggleRangeBtn(); renderStats(); };
  document.getElementById('rangeAll').onclick = () => { statsRange='all'; toggleRangeBtn(); renderStats(); };
  function toggleRangeBtn(){
    document.getElementById('rangeMonth').classList.toggle('active', statsRange==='month');
    document.getElementById('rangeAll').classList.toggle('active', statsRange==='all');
  }

  function renderStats(){
    const y = cur.getFullYear(), m = cur.getMonth();
    const keys = Object.keys(entries).filter(k => {
      if (statsRange === 'all') return true;
      const [ky,km] = k.split('-').map(Number);
      return ky === y && km === m+1;
    });

    const counts = {};
    ACTIONS.forEach(a => counts[a.id] = 0);
    let daysWithCare = 0;
    keys.forEach(k => {
      const acts = entries[k] || [];
      if (acts.length) daysWithCare++;
      acts.forEach(id => { if (counts[id] !== undefined) counts[id]++; });
    });

    document.getElementById('totalDays').textContent = daysWithCare;

    // streak since last hair wash (days pospil bez myttia)
    const allDates = Object.keys(entries).sort();
    let streak = 0;
    const t = new Date();
    for (let i=0; i<365; i++){
      const dd = new Date(t); dd.setDate(t.getDate()-i);
      const key = dateKey(dd.getFullYear(), dd.getMonth(), dd.getDate());
      const acts = entries[key] || [];
      if (acts.includes('hairwash')) break;
      streak++;
    }
    document.getElementById('hairStreak').textContent = streak;

        const wrap = document.getElementById('barsWrap');
    wrap.innerHTML = '';

    const todayD = new Date(); todayD.setHours(0,0,0,0);
    const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];

    ACTIONS.forEach(a => {
      let lastKey = null;
      Object.keys(entries).sort().forEach(k => {
        if ((entries[k] || []).includes(a.id)) lastKey = k;
      });

      const item = document.createElement('div');
      item.className = 'last-used-row';

      let rightHtml;
      if (lastKey){
        const [ly,lm,ld] = lastKey.split('-').map(Number);
        const lastD = new Date(ly, lm-1, ld);
        const diffDays = Math.round((todayD - lastD) / 86400000);
        const dateLabel = `${ld} ${MONTHS_GEN[lm-1]}`;
        let agoLabel;
        if (diffDays <= 0) agoLabel = 'сьогодні';
        else if (diffDays === 1) agoLabel = '1 день тому';
        else if (diffDays >= 2 && diffDays <= 4) agoLabel = `${diffDays} дні тому`;
        else agoLabel = `${diffDays} днів тому`;
        rightHtml = `${dateLabel} <span class="ago">(${agoLabel})</span>`;
      } else {
        rightHtml = `<span class="ago">ще не відмічено</span>`;
      }

      item.innerHTML = `
        <div class="name"><img src="${a.icon}" alt=""> ${a.label}</div>
        <div class="last-date">${rightHtml}</div>
      `;
      wrap.appendChild(item);
    });
  }

  function render(){
    renderCalendar();
    if (document.getElementById('statsView').style.display !== 'none') renderStats();
  }

  render();
</script>
